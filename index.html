<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Jeopardy by Lys</title>
    <link rel="icon" type="image/x-icon" href="https://ik.imagekit.io/lyseste/lyseste-site/lys-logomark.png?tr=w-50,h-50">
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div id="toastContainer" class="toastContainer"></div>
    <div id="mainMenu">
      <h2>Jeopardy Creator</h2>
      <button id="aboutInfo">i</button>
      <button id="playBoardBtn">Play</button>
      <select id="boardSelect"></select>
      <div class="btnRowMain">
        <button id="newBoardBtn">New Board</button>
        <button id="editBoardBtn">Edit</button>
        <button id="deleteBoardBtn">Delete</button>
        <button id="exportBoardBtn">Export</button>
        <button id="importBoardBtn">Import</button>
        <input type="file" id="importFile" accept=".json" hidden />
      </div>
    </div>

    <div id="editor" class="hidden">
      <h2>Board Editor</h2>
      Categories:
      <input type="number" id="catCount" value="5" min="1" /> Questions per
      category: <input type="number" id="rowCount" value="5" min="1" />
      <button id="generateGridBtn">Update</button>
      <div id="editorGrid"></div>
      <button id="saveBoardBtn">Save</button>
      <button class="backBtn">Back</button>
    </div>

    <div id="playMode" class="hidden">
      <button class="backBtn">Exit</button>
      <button id="finalBtn">Final Jeopardy</button>
      <table id="board"></table>
      <div class="scoreboard" id="scoreboard"></div>
      <div class="btnRowTeam">
        <button id="addTeamBtn" data-tooltip="Add team"><span>+</span></button>
      </div>
    </div>

    <div id="questionModal" class="modal"></div>
    
    <div id="editorModal" class="modal">
      <div class="editorCard">
        <h2>Edit Question</h2>

        <label>Point Value</label>
        <input type="number" id="editValue" min="0" />
        
        <label>Hint Cost</label>
        <input type="number" id="editHintCost" min="0" />

        <label>Question Type</label>
        <select id="editType">
          <option value="text">Text</option>
          <option value="video">Video</option>
          <option value="audio">Audio</option>
        </select>

        <label>Question Text</label>
        <input type="text" class="editorTextArea" id="editQuestionText"/>
        <label>Answer</label>
        <input type="text" class="editorTextArea" id="editAnswerText"/>

        <label>Media Files</label>
        <div class="mediaSection">
          <button type="button" id="addMediaBtn" class="linkbtn">Upload Media</button>
          <input type="file" id="editMedia" multiple hidden />
          <button type="button" id="addEmbedBtn" class="linkbtn">Add Media Embed</button>
          <div id="mediaPreviewList" class="mediaPreviewList"></div>
        </div>
        <div class="editorButtons">
          <button id="saveQuestionBtn">Save</button>
          <button id="cancelQuestionBtn">Cancel</button>
        </div>
      </div>
    </div>
      
    <div id="infoModal" class="modal">
        <div class="modalContent">
            <h2>Jeopardy Creator App</h2>
            <label>Made by Lys</label>
            <label class="appVersion">App Version 1.1.0</label>
            <div class="btnRowModal">
                <!--<a class="linkbtn" href="https://twitter.com/lyseste" target="_blank"><i class="fa-brands fa-twitter"></i>Twitter</a>-->
                <a class="modalBtn" href="https://github.com/lyseste/Jeopardy" target="_blank"><i class="fa-brands fa-github"></i>GitHub</a>
                <button id="closeInfo" class="modalBtn"">Close</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
